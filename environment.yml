# conda environment for the radiometric correction program:  conda env create -f environment.yml
# Then choose its python.exe with launchers\select_python.cmd (see docs/installation.md).
# ExifTool, the program that reads the metadata of the images, is not included: install it separately.
# pyzbar comes from pip because conda-forge has no Windows build of zbar. On Windows it needs the Microsoft Visual C++ 2013
# Redistributable (x64): winget install Microsoft.VCRedist.2013.x64
# Do not run pip install -r requirements.txt in this environment (pip would add a second OpenCV).
name: radiometric
channels:
  - conda-forge
dependencies:
  - python=3.10
  - tk
  - numpy>=2.2.6
  - opencv>=4.12.0,<5
  - pillow>=12.0.0
  - tifffile>=2025.5.10
  - matplotlib>=3.10.8
  - scikit-image>=0.25.2
  - shapely>=2.1.2
  - pip
  - pip:
      - pyzbar>=0.1.9
      - PyExifTool>=0.5.6
